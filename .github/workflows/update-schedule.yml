name: Update Schedule

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch schedule from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os
          from datetime import datetime, timezone

          token = os.environ['AIRTABLE_TOKEN']
          base_id = os.environ['AIRTABLE_BASE_ID']
          table_id = 'tblPxTG3XEiKJS6C3'

          # ── Fields to always skip (metadata / admin / non-crew) ────────────
          # Everything NOT in this set and NOT empty is treated as a crew role
          # automatically — so adding new positions in Airtable requires no
          # changes here.
          SKIP = {
            'Game Date', 'DOW', 'Opponent', 'Game Time',
            'Crew Call', 'Crew Meeting',
            'Conversion?', 'Crew Complete',
            'Last Modified', 'Created', 'Created By',
            '2023 Stanley Cup Playoffs Round 1',
          }

          def extract(val):
            if val is None: return ''
            if isinstance(val, str): return val
            if isinstance(val, dict):
              return val.get('name', '') or val.get('value', '') or str(val)
            if isinstance(val, list):
              parts = []
              for item in val:
                if isinstance(item, dict):
                  parts.append(item.get('name', '') or item.get('value', '') or '')
                elif isinstance(item, str):
                  parts.append(item)
              return ', '.join(p for p in parts if p)
            return str(val)

          import urllib.parse
          view_name = '2026-27 Main Scheduling View - Shared'

          all_records = []
          offset = None
          while True:
            url = f'https://api.airtable.com/v0/{base_id}/{table_id}?pageSize=100&view={urllib.parse.quote(view_name)}'
            if offset: url += f'&offset={offset}'
            req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/json'
            })
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
            all_records.extend(data.get('records', []))
            offset = data.get('offset')
            if not offset: break

          clean = []
          for r in all_records:
            f = r['fields']
            date_val = extract(f.get('Game Date', ''))
            if not date_val or len(date_val) != 10 or date_val < '2026-08-01':
              continue
            rec = {
              'id': r['id'],
              'date': date_val,
              'dow': extract(f.get('DOW', '')),
              'opponent': extract(f.get('Opponent', '')),
              'gameTime': extract(f.get('Game Time', '')),
              'crewCall': extract(f.get('Crew Call', '')),
              'crewMeeting': extract(f.get('Crew Meeting', '')),
              'roles': {}
            }
            # Every field not in SKIP with a non-empty value is a crew role.
            # New positions added in Airtable are automatically included.
            for key, val in f.items():
              if key in SKIP: continue
              extracted = extract(val)
              if extracted:
                rec['roles'][key] = extracted
            clean.append(rec)

          clean.sort(key=lambda x: x['date'])

          updated = datetime.now(timezone.utc).isoformat()
          with open('schedule.json', 'w') as fout:
            json.dump({'updated': updated, 'records': clean}, fout)

          # ── Tracked positions — must match TRACKED_POSITIONS in production.html ──
          # Used only to detect "mandatory all-staff" events (every tracked
          # position blank), which get included in EVERY person's personal feed.
          TRACKED_POSITIONS = [
            'Executive Producer','Entertainment Producer','Associate Producer','Production Associate',
            'Digital Displays Associate','Engineer/AV Lead','Engineer 2','PA Announcer','Host',
            'Stage Manager 1','Stage Manager 2','Stage Manager 3','Stage Manager 4',
            'Organist','Spotter','DJ','Director','Technical Director','7Point Audio / Music',
            'Ross Tessera 1 (LED)','Ross Tessera 2 (LED)','Ross Kiva (Playback)',
            'CG 1','CG 2','Social Media',
            'Replay (A & B)','Replay (C & D)','Replay (E & F)','Replay (Tagging)',
            'Audio 1 / Mixer','Shader',
            'Camera 1','Camera 2','Camera 3','Camera 4 (Video Coach Cam)','Camera 5 (Wireless)','Camera 6 (Wireless)',
            'Grip','Robo Cam (Faceoff 1-4)','Robo Cam Scoreboard (1-2)','Robo Cam Scoreboard (3 & 4)',
            'Lighting','Spot 1','Spot 2','Spot 3','Spot 4',
            'SMT','Audio Engineer',
          ]

          def is_mandatory_all_staff(rec):
            return all(not rec['roles'].get(pos) for pos in TRACKED_POSITIONS)

          import re
          def slugify(name):
            s = name.strip().lower()
            s = re.sub(r'\s+', '-', s)
            s = re.sub(r'[^a-z0-9\-]', '', s)
            return s

          # Also write a subscribable .ics file for Google Calendar
          def parse_time(t):
            if not t: return None
            m = re.search(r'(\d+):(\d+)\s*(AM|PM)', str(t), re.I)
            if not m: return None
            h, mn, ap = int(m.group(1)), int(m.group(2)), m.group(3).upper()
            if ap == 'PM' and h != 12: h += 12
            if ap == 'AM' and h == 12: h = 0
            return h, mn

          # Convert local America/New_York time to a UTC 'Z' timestamp — this
          # sidesteps needing an embedded VTIMEZONE block entirely (a common
          # source of parsing failures in stricter clients like Outlook) and
          # correctly handles the EST/EDT transition since the season spans it.
          from zoneinfo import ZoneInfo
          from datetime import timedelta
          NY_TZ = ZoneInfo('America/New_York')

          def to_ics_dt(date_str, time_str, offset_mins=0):
            y, mo, d = map(int, date_str.split('-'))
            t = parse_time(time_str)
            if not t:
              local_dt = datetime(y, mo, d, 12, 0, tzinfo=NY_TZ)
            else:
              local_dt = datetime(y, mo, d, t[0], t[1], tzinfo=NY_TZ)
            local_dt += timedelta(minutes=offset_mins)
            utc_dt = local_dt.astimezone(timezone.utc)
            return utc_dt.strftime('%Y%m%dT%H%M%SZ')

          # RFC 5545 requires lines over 75 octets to be "folded" (wrapped
          # with a leading space on continuation lines). Our DESCRIPTION
          # lines routinely exceed this — unfolded long lines are a classic
          # cause of ICS parsing failures, especially in Outlook.
          def fold_ical_line(line):
            encoded_len = len(line.encode('utf-8'))
            if encoded_len <= 75:
              return line
            parts = []
            remaining = line
            while len(remaining.encode('utf-8')) > 75:
              # Safe ASCII-width slice; content here is plain ASCII so
              # char-count and byte-count folding are equivalent.
              parts.append(remaining[:75])
              remaining = ' ' + remaining[75:]
            parts.append(remaining)
            return '\r\n'.join(parts)

          def build_ics(records, calname):
            dtstamp = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
            lines = [
              'BEGIN:VCALENDAR', 'VERSION:2.0',
              'PRODID:-//FLA Panthers//Production Crew Schedule//EN',
              'CALSCALE:GREGORIAN', f'X-WR-CALNAME:{calname}',
              'X-WR-TIMEZONE:America/New_York', 'METHOD:PUBLISH',
            ]
            for g in records:
              start = to_ics_dt(g['date'], g.get('crewCall') or g.get('gameTime'))
              end   = to_ics_dt(g['date'], g.get('crewCall') or g.get('gameTime'), 330)
              desc = f"Crew Call: {g.get('crewCall','TBD')}\\nPuck Drop: {g.get('gameTime','TBD')}\\nFlorida Panthers Game Presentation\\nAmerant Bank Arena | Sunrise FL"
              lines += [
                'BEGIN:VEVENT',
                f'UID:{g["id"]}@panthers-prod',
                f'DTSTAMP:{dtstamp}',
                f'DTSTART:{start}',
                f'DTEND:{end}',
                f'SUMMARY:Panthers vs {g["opponent"]}',
                f'DESCRIPTION:{desc}',
                'LOCATION:Amerant Bank Arena\\, Sunrise\\, FL',
                'END:VEVENT',
              ]
            lines.append('END:VCALENDAR')
            return '\r\n'.join(fold_ical_line(l) for l in lines)


          # Shared, full-season feed (unchanged — used when no name is picked)
          with open('schedule.ics', 'w') as fout:
            fout.write(build_ics(clean, 'Panthers Production 2026-27'))

          # ── Per-person feeds ────────────────────────────────────────────────
          # One .ics per crew member, containing only their games plus any
          # mandatory all-staff (fully-unstaffed) events — mirrors the site's
          # own personalization logic exactly.
          all_names = set()
          for rec in clean:
            for val in rec['roles'].values():
              for part in val.split(','):
                part = part.strip()
                if part:
                  all_names.add(part)

          os.makedirs('schedules', exist_ok=True)
          expected_slugs = set()
          for person in sorted(all_names):
            person_lower = person.lower()
            person_records = [
              rec for rec in clean
              if is_mandatory_all_staff(rec)
              or any(person_lower in val.lower() for val in rec['roles'].values())
            ]
            slug = slugify(person)
            if not slug: continue
            expected_slugs.add(slug)
            with open(f'schedules/{slug}.ics', 'w') as fout:
              fout.write(build_ics(person_records, f'Panthers Production — {person}'))

          # ── Cleanup: remove feeds for people no longer in the schedule ──
          removed = 0
          for fname in os.listdir('schedules'):
            if fname.endswith('.ics') and fname[:-4] not in expected_slugs:
              os.remove(os.path.join('schedules', fname))
              removed += 1

          print(f'Wrote {len(clean)} records to schedule.json + schedule.ics, plus {len(all_names)} personal feeds in schedules/ ({removed} stale feeds removed)')
          EOF

      - name: Commit and push schedule files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json schedule.ics schedules/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update schedule $(date -u '+%Y-%m-%d')"
          git push

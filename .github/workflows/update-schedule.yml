name: Update Schedule

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch schedule from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os
          from datetime import datetime, timezone

          token = os.environ['AIRTABLE_TOKEN']
          base_id = os.environ['AIRTABLE_BASE_ID']
          table_id = 'tblPxTG3XEiKJS6C3'

          # ── Fields to always skip (metadata / admin / non-crew) ────────────
          # Everything NOT in this set and NOT empty is treated as a crew role
          # automatically — so adding new positions in Airtable requires no
          # changes here.
          SKIP = {
            'Game Date', 'DOW', 'Opponent', 'Game Time',
            'Crew Call', 'Crew Meeting',
            'Conversion?', 'Crew Complete',
            'Last Modified', 'Created', 'Created By',
            '2023 Stanley Cup Playoffs Round 1',
          }

          # ── Positions that should NEVER be flagged as "Open" even when blank ──
          # (occasional/special-event-only positions, not routine per-game roles)
          EXCLUDE_FROM_OPEN_FLAG = {
            'Video Engineer',
            'Utility / Training', 'Utility / Training 2',
            'Blimp Operator 1', 'Blimp Operator 2',
          }

          # ── Fallback list of tracked positions, in case the live schema fetch ──
          # below fails (e.g. token lacks schema.bases:read scope). This is a
          # snapshot of real Airtable field names as of Sept 2026. If Airtable
          # gains new position columns later, the live fetch picks them up
          # automatically; this fallback just prevents the whole workflow from
          # breaking if that fetch ever fails.
          FALLBACK_TRACKED_POSITIONS = [
            'Executive Producer', 'Entertainment Producer', 'Associate Producer',
            'Production Associate', 'Digital Displays Associate', 'Engineer/AV Lead',
            'Engineer 2', 'PA Announcer', 'Host', 'Stage Manager 1', 'Stage Manager 2',
            'Stage Manager 3', 'Stage Manager 4', 'Stage Manager 5', 'Organist',
            'Spotter', 'DJ', 'Director', 'Technical Director', '7Point Audio / Music',
            'Ross Tessera 1 (LED)', 'Ross Tessera 2 (LED)', 'Ross Kiva (Playback)',
            'CG 1', 'CG 2', 'Social Media', 'Replay (A & B)', 'Replay (C & D)',
            'Replay (E & F)', 'Replay (Tagging)', 'Replay (Alternate)',
            'Audio 1 / Mixer', 'Shader', 'Camera 1', 'Camera 2', 'Camera 3',
            'Camera 4 (Video Coach Cam)', 'Camera 5 (Wireless)', 'Camera 6 (Wireless)',
            'Grip', 'Robo Cam (Faceoff 1-4)', 'Robo Cam Scoreboard (1-2)',
            'Robo Cam Scoreboard (3 & 4)', 'Robo Camera 7', 'Lighting',
            'Lighting Engineer', 'Spot 1', 'Spot 2', 'Spot 3', 'Spot 4', 'SMT',
            'Audio Engineer', 'Projection SMT (Catwalk)', 'ENG Shooter 1',
            'ENG Shooter 2', 'ENG Shooter 3', 'Training', 'Training 2',
          ]

          # ── Try to fetch the live field list so new Airtable columns are ──
          # picked up automatically. Falls back to the static list above if
          # this fails for any reason (never let this break the whole workflow).
          tracked_positions = list(FALLBACK_TRACKED_POSITIONS)
          try:
            schema_req = urllib.request.Request(
              f'https://api.airtable.com/v0/meta/bases/{base_id}/tables',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'}
            )
            with urllib.request.urlopen(schema_req, timeout=15) as resp:
              schema_data = json.loads(resp.read())
            for t in schema_data.get('tables', []):
              if t.get('id') == table_id:
                live_positions = [
                  fld['name'] for fld in t.get('fields', [])
                  if fld.get('name') and fld['name'] not in SKIP
                  and fld['name'] not in EXCLUDE_FROM_OPEN_FLAG
                ]
                if live_positions:
                  tracked_positions = live_positions
                break
          except Exception as e:
            print(f'Schema fetch failed, using fallback tracked-positions list: {e}')

          def extract(val):
            if val is None: return ''
            if isinstance(val, str): return val
            if isinstance(val, dict):
              return val.get('name', '') or val.get('value', '') or str(val)
            if isinstance(val, list):
              parts = []
              for item in val:
                if isinstance(item, dict):
                  parts.append(item.get('name', '') or item.get('value', '') or '')
                elif isinstance(item, str):
                  parts.append(item)
              return ', '.join(p for p in parts if p)
            return str(val)

          import urllib.parse
          view_name = '2026-27 Main Scheduling View - Shared'

          all_records = []
          offset = None
          while True:
            url = f'https://api.airtable.com/v0/{base_id}/{table_id}?pageSize=100&view={urllib.parse.quote(view_name)}'
            if offset: url += f'&offset={offset}'
            req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/json'
            })
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
            all_records.extend(data.get('records', []))
            offset = data.get('offset')
            if not offset: break

          clean = []
          for r in all_records:
            f = r['fields']
            date_val = extract(f.get('Game Date', ''))
            if not date_val or len(date_val) != 10 or date_val < '2026-08-01':
              continue
            rec = {
              'id': r['id'],
              'date': date_val,
              'dow': extract(f.get('DOW', '')),
              'opponent': extract(f.get('Opponent', '')),
              'gameTime': extract(f.get('Game Time', '')),
              'crewCall': extract(f.get('Crew Call', '')),
              'crewMeeting': extract(f.get('Crew Meeting', '')),
              'roles': {}
            }
            # Every field not in SKIP with a non-empty value is a crew role.
            # New positions added in Airtable are automatically included.
            for key, val in f.items():
              if key in SKIP: continue
              extracted = extract(val)
              if extracted:
                rec['roles'][key] = extracted

            # Positions from the tracked list that are blank for this game.
            rec['openPositions'] = [
              pos for pos in tracked_positions
              if not extract(f.get(pos))
            ]
            clean.append(rec)

          clean.sort(key=lambda x: x['date'])

          updated = datetime.now(timezone.utc).isoformat()
          with open('schedule.json', 'w') as fout:
            json.dump({'updated': updated, 'records': clean}, fout)

          # Also write a subscribable .ics file for Google Calendar
          import re as _re
          def parse_time(t):
            if not t: return None
            m = _re.search(r'(\d+):(\d+)\s*(AM|PM)', str(t), _re.I)
            if not m: return None
            h, mn, ap = int(m.group(1)), int(m.group(2)), m.group(3).upper()
            if ap == 'PM' and h != 12: h += 12
            if ap == 'AM' and h == 12: h = 0
            return h, mn

          def to_ics_dt(date_str, time_str, offset_mins=0):
            y, mo, d = map(int, date_str.split('-'))
            t = parse_time(time_str)
            if not t: return f'{y}{mo:02d}{d:02d}T120000'
            from datetime import datetime as dt2
            base = dt2(y, mo, d, t[0], t[1])
            from datetime import timedelta
            base += timedelta(minutes=offset_mins)
            return base.strftime('%Y%m%dT%H%M%S')

          lines = [
            'BEGIN:VCALENDAR', 'VERSION:2.0',
            'PRODID:-//FLA Panthers//Production Crew Schedule//EN',
            'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Panthers Production 2026-27',
            'X-WR-TIMEZONE:America/New_York', 'METHOD:PUBLISH',
          ]
          for g in clean:
            start = to_ics_dt(g['date'], g.get('crewCall') or g.get('gameTime'))
            end   = to_ics_dt(g['date'], g.get('crewCall') or g.get('gameTime'), 330)
            desc = f"Crew Call: {g.get('crewCall','TBD')}\\nPuck Drop: {g.get('gameTime','TBD')}\\nFlorida Panthers Game Presentation\\nAmerant Bank Arena | Sunrise FL"
            lines += [
              'BEGIN:VEVENT',
              f'UID:{g["id"]}@panthers-prod',
              f'DTSTART;TZID=America/New_York:{start}',
              f'DTEND;TZID=America/New_York:{end}',
              f'SUMMARY:Panthers vs {g["opponent"]}',
              f'DESCRIPTION:{desc}',
              'LOCATION:Amerant Bank Arena\\, Sunrise\\, FL',
              'END:VEVENT',
            ]
          lines.append('END:VCALENDAR')
          with open('schedule.ics', 'w') as fout:
            fout.write('\r\n'.join(lines))

          print(f'Wrote {len(clean)} records to schedule.json + schedule.ics')
          EOF

      - name: Commit and push schedule files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json schedule.ics
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update schedule $(date -u '+%Y-%m-%d')"
          git push
